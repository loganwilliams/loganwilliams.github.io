<script type="text/plain" id="poem-source">
# Edit the poem here. The page colors words and draws the columns.
# A stanza is a header line, then one verse line per row, then a blank line.
# Header: da or en, then nonindent, extract, nonindent01, nonindent02, or nonindent03.
# A line that is only ~ is an empty spacer, used where one language has no matching lines.
# # 12 starts section 12.

# 1

da nonindent
abrikostræerne findes, abrikostræerne findes

en nonindent
apricot trees exist, apricot trees exist

# 2

da nonindent
bregnerne findes; og brombær, brombær
og brom findes; brinten, brinten

en nonindent
bracken exists; and blackberries, blackberries;
bromine exists; and hydrogen, hydrogen

# 3

da nonindent
cikaderne findes; cikorie, chrom
og citrontræer findes; cikaderne findes;
cikaderne, ceder, cypres, cerebellum

en nonindent
cicadas exist; chicory, chromium,
citrus trees; cicadas exist;
cicadas, cedars, cypresses, the cerebellum

# 4

da nonindent
duerne findes; drømmerne, dukkerne
dræberne findes; duerne, duerne;
dis, dioxin og dagene; dagene
findes; dagene døden; og digtene
findes; digtene, dagene, døden

en nonindent
doves exist, dreamers, and dolls;
killers exist, and doves, and doves;
haze, dioxin, and days; days
exist, days and death; and poems
exist; poems, days, death

# 5

da nonindent
efteråret findes; eftersmagen og eftertanken
findes; og enrummet findes; englene,
enkerne og elsdyret findes; enkelthederne
findes, erindringen, erindringens lys;
og efterlyset findes, egetræet og elmetræet
findes, og enebærbusken, ensheden, ensomheden
findes og edderfuglen og edderkoppen findes
og eddiken findes, og eftertiden, eftertiden

en nonindent
early fall exists; aftertaste, afterthought;
seclusion and angels exist;
widows and elk exist; every
detail exists; memory, memory’s light;
afterglow exists; oaks, elms,
junipers, sameness, loneliness exist;
eider ducks, spiders, and vinegar
exist, and the future, the future

# 6

da nonindent
fiskehejren findes, med sin gråblå hvælvede
ryg findes den, med sin fjertop sort
og sine halefjer lyse findes den; i kolonier
findes den; i den såkaldte Gamle Verden;
findes også fiskene; og fiskeørnen, fjeldrypen
falken; festgræsset og fårenes farver;
fissionsprodukterne findes og figentræet findes;
fejlene findes, de grove, de systematiske,
de tilfældige; fjernstyringen findes og fuglene;
og frugttræerne findes og frugterne i frugthaven hvor
abrikostræerne findes, abrikostræerne findes,
i lande hvor varmen vil frembringe netop den
farve i kødet abrikosfrugten har

en nonindent
fisherbird herons exist, with their grey-blue arching
backs, with their black-feathered crests and their
bright-feathered tails they exist; in colonies
they exist, in the so-called Old World;
fish, too, exist, and ospreys, ptarmigans,
falcons, sweetgrass, and the fleeces of sheep;
fig trees and the products of fission exist;
errors exist, instrumental, systemic,
random; remote control exists, and birds;
and fruit trees exist, fruit there in the orchard where
apricot trees exist, apricot trees exist
in countries whose warmth will call forth the exact
colour of apricots in the flesh

# 7

da nonindent
grænserne findes; gaderne, glemslen

en nonindent
given limits exist, streets, oblivion

da extract
og græs og geder og agurker og gyvel,
begejstringen findes, grænserne findes;

en extract
and grass and gourds and goats and gorse,
eagerness exists, given limits

da extract
grenene findes, vinden der løfter dem
findes, og grenenes eneste tegning

en extract
branches exist, wind lifting them exists,
and the lone drawing made by the branches

da extract
af netop det træ der kaldes egetræet findes,
af netop det træ der kaldes asketræet, birketræet,
cedertræet findes, og tegningen gentaget

en extract
of the tree called an oak tree exists,
of the tree called an ash tree, a birch tree,
a cedar tree, the drawing repeated

da extract
findes i havegangenes grus; findes
også gråden, og gedehams og gråbynke findes,
gidslerne, grågåsen, grågåsens unger;

en extract
in the gravel garden path; weeping
exists as well, fireweed and mugwort,
hostages, greylag geese, greylags and their young;

da extract
og geværerne findes, en gådefuld baghave,
tilgroet, gold og kun smykket med ribs,
geværerne findes; midt i den oplyste
kemiske ghetto findes geværerne,
med deres gammeldags, fredelige præcision findes

en extract
and guns exist, an enigmatic back yard;
overgrown, sere, gemmed just with red currants,
guns exist; in the midst of the lit-up
chemical ghetto guns exist
with their old-fashioned, peaceable precision

da extract
geværerne, og grædekonerne findes, mætte
som grådige ugler, gerningsstedet findes;
gerningsstedet, døsigt, normalt og abstrakt,
badet i et hvidkalket, gudsforladt lys,
dette giftige, hvide, forvitrende digt

en extract
guns and wailing women, full as
greedy owls exist; the scene of the crime exists;
the scene of the crime, drowsy, normal, abstract,
bathed in a whitewashed, godforsaken light,
this poisonous, white, crumbling poem

# 8

da nonindent
hviskningerne findes, hviskningerne findes,
høsten, historien findes, og Halleys

en nonindent
whisperings exist, whisperings exist
harvest, history, and Halley’s

da extract
komet; hærskarerne findes, horderne
herskerne, hulerne, inde i hulerne
halvskyggen, inde i halvskyggen af og til

en extract
comet exist; hosts exist, hordes
high commanders, hollows, and within the hollows
half-shadows, within the half-shadows occasional

da extract
harerne, af og til bladhang for hulen hvor
bregnerne findes; og brombær, brombær,
af og til harerne skjult under bladhanget

en extract
hares, occasional hanging leaves shading the hollow where
bracken exists, and blackberries, blackberries
occasional hares hidden under the leaves

da extract
og haverne findes, havekunsten, hyldetræets
blege, ubevægelige blomster som en sydende
hymne; og halvmånen findes, halvsilken,
hele den heliocentriske dis der har drømt
disse hengivne hjerner, deres held; og huden

en extract
and gardens exist, horticulture, the elder tree’s
pale flowers, still as a seething hymn;
the half-moon exists, half-silk, and the whole
heliocentric haze that has dreamed
these devoted brains, their luck, and human skin

da extract
huden og husene findes, Hades der
genhuser hesten og hunden og herlighedens
skygger, håbet; og hævnfloden, hagl
under stenhimlen findes, hortensiens
hvide, lyst lysende blå eller grønlige

en extract
human skin and houses exist, with Hades
rehousing the horse and the dog and the shadows
of glory, hope; and the river of vengeance;
hail under stoneskies exists, the hydrangeas’ white, bright-shining, blue or greenish

da extract
søvntåger, af og til blegrøde, enkelte
flager sterile findes; og hen under
himmelhvælvets skrå Harmagedon giften,
gifthelikopterens susende harpe over hyrdetaske,
hønsetarm og hør; hyrdetaske, hønsetarm
og hør, denne sidste hermetiske skrift,
som ellers kun skrives af børn; og hveden,
hveden i hvedemarken findes, hvedemarkens
svimlende vandrette viden, halveringtider,
hungersnød og honning; og inderst i hjertet,
ellers som altid kun inderst i hjertet
hasselbuskens rødder, hasselbusken udsat
på hjertets bjerge, hårdfør og nøjsom,
en ophobet hverdag af englenes orden;
hurtigt, hyacintisk i sit henfald livet,
som i himlen således også på jorden

en extract
fogs of sleep, occasionally pink, a few
sterile patches exist, and beneath
the angled Armageddon of the arching heavens, poison,
the poison helicopter’s humming harps above the henbane,
shepherd’s purse, and flax, henbane, shepherd’s purse
and flax; this last, hermetic writing,
written otherwise only by children; and wheat,
wheat in wheatfields exists, the head-spinning horizontal knowledge of wheatfields, half-lives,
famine, and honey; and deepest in the heart,
otherwise as ever only deepest in the heart,
the roots of the hazel, the hazel that stands
on the hillslope of the heart, tough and hardy,
an accumulated weekday of Angelic orders;
high-speed, hyacinthic in its decay, life,
on earth as it is in heaven

# 9

da nonindent
istiderne findes, istiderne findes,
ishavets is og isfuglens is;
cikaderne findes; cikorie, chrom

en nonindent
ice ages exist, ice ages exist,
ice of polar seas, kingfishers’ ice;
cicadas exist, chicory, chromium

da extract
og den chromgule iris, den blå; ilten
især; findes også ishavets isflager,
isbjørnen findes, stemplet som en pels
med personnummer findes den, idømt sit liv;
og isfuglens ministyrt ned I de blåfrosne

en extract
and chrome yellow irises, or blue; oxygen
especially; ice floes of polar seas also exist,
and polar bears, stamped like furs with their
identification numbers, condemned to their lives;
the kingfisher’s miniplunge into blue-frozen

da extract
martsbække findes, hvis bækkene findes;
hvis ilten I bækkene findes, ilten
især; findes især hvor cikadernes
i-lyde findes, især hvor cikoriens
himmel som blåelse opløst I vand

en extract
March streams exists, if streams exist;
if oxygen in streams exists, especially
oxygen, especially where cicadas’
i-sounds exist, especially where
the chicory sky, like bluing dissolving in

da extract
findes, den chromgule sol, ilten
især; vist vil den findes, vist
vil vi findes, ilten vi indånder findes,
ildøje ildkrone findes, og indsøens
himmelske indre; en indhegnet vig
med lidt siv vil findes, en ibisfugl findes,
og sindets bevægelser indblæst I skyerne
findes, som ilthvirvler inderst I Styx

en extract
water, exists, the chrome yellow sun, especially
oxygen, indeed it will exist, indeed
we will exist, the oxygen we inhale will exist,
lacewings, lantanas will exist, the lake’s
innermost depths like a sky; a cove ringed
with rushes, an ibis will exist,
the motions of mind blown into the clouds
like eddies of oxygen deep in the Styx

da extract
og inderst I visdommens landskab islyset,
isen identisk med lyset, og inderst
I islyset intet, livagtigt, intenst,
som dit blik gennem regn; denne silende
livsstiliserende finregn, hvori som en gestus
de fjorten krystalgitre findes, de syv
krystallinske systemer, dit blik som I mit,
og Ikaros, Ikaros hjælpeløs findes;

en extract
and deep in the landscapes of wisdom, ice-light,
ice and identical light, and deep
in the ice-light nothing, lifelike, intense
as your gaze in the rain; this incessant,
life-stylising drizzle, in which like a gesture
fourteen crystal forms exist, seven
systems of crystals, your gaze as in mine,
and Icarus, Icarus helpless;

da extract
Ikaros svøbt I de smeltede voksvinger
findes, Ikaros bleg som et lig
I civil findes, Ikaros underst hvor
duerne findes; drømmerne, dukkerne
findes; drømmernes hår med de løsrevne
kræfttotter, dukkernes hud rimpet sammen
med nåle, gådernes trøske; og smilene
findes, Ikarosbørnene hvide som lam
gennem grålyset, vist vil de findes, vist
vil vi findes, og ilten på iltens krucifiks;
som rim vil vi findes, som vind vil vi findes,
som regnbuens iris I isplantens glitrende
udvækster, tundraens strå; som små

en extract
Icarus wrapped in the melting wax
wings exists, Icarus pale as a corpse
in street clothes, Icarus deepest down where
doves exist, dreamers, and dolls;
the dreamers, their hair with detached
tufts of cancer, the skin of the dolls tacked together
with pins, the dryrot of riddles; and smiles,
Icarus-children white as lambs
in greylight, indeed they will exist, indeed
we will exist, with oxygen on its crucifix,
as rime we will exist, as wind,
as the iris of the rainbow in the iceplant’s gleaming
growths, the dry tundra grasses, as small beings

da extract
vil vi findes, så små som lidt pollen I tørv,
som lidt virus I knogler, som vandpest måske,
måske som lidt hvidkløver, vikke, lidt skivekamille
forvist til det gentabte paradis; men mørket
er hvidt, siger børnene, paradismørket er hvidt,
men ikke på den måde hvidt som en kiste
er hvid, hvis kister da findes, og ikke
på den måde hvidt, som mælken er hvid,
hvis mælken da findes; hvidt, det er hvidt,
siger børnene, mørket er hvidt, men ikke
på den måde hvidt som det hvide der fandtes,
da frugttræerne fandtes, deres blomstring så hvid,
mørket er hvidere, øjnene smelter

en extract
we will exist, small as pollen bits in peat,
as virus bits in bones, as water-thyme perhaps,
perhaps as white clover, as vetch, wild chamomile,
banished to a re-lost paradise; but the darkness
is white, say the children, the paradise-darkness is white,
but not white the same way that coffins
are white, if coffins exist, and not white
the same way that milk is white, if milk exists;
white, it is white, say the children,
the darkness is white, but not
white like the white that existed
when fruit trees existed, their blossoms so white,
this darkness is whiter; eyes melt

# 10

da nonindent
juninatten findes, juninatten findes,
himlen omsider som løftet til himmelske
højder og samtidig sænket så ømt som når
drømme kan ses før de drømmes; et rum som
besvimet, som mættet med hvidhed, en timeløs

en nonindent
June nights exist, June nights exist,
the sky at long last as if lifted to heavenly
heights, simultaneously sinking, as tenderly as
when dreams can be seen before they are dreamed; a space
as if dizzied, as if filled with whiteness, an hourless

da extract
kimen af dug og insekter, og ingen i
denne flyvende sommer, ingen begriber at
efteråret findes, eftersmagen og eftertanken
findes, kun disse ratløse ultralydes
svimlende rækker findes og flagermusens
jadeøre vendt mod den tikkende dis;
aldrig var jordklodens hældning så dejlig
aldrig de zinkhvide nætter så hvide,

en extract
chiming of insects and dew, and no one in
this gossamer summer, no one comprehends that
early fall exists, aftertaste, afterthought;
just these reeling sets of restless ultrasounds
exist, the bat’s ears of jade
turned toward the ticking haze;
never has the tilting of the planet been so pleasant,
never the zinc-white nights so white,

da extract
så værgeløst opløste, mildt ioniserede
hvide, og aldrig usynlighedsgrænsen så næsten
berørt; juni, juni, dine jakobsstiger
findes, dine sovende kræ og deres søvndrømme
findes, et svæv af galaktiske kim mellem
jorden så jordisk og himlen så himmelsk,
jammerdalen stille, så stille, og gråden
sunket ned, sunket ned, som grundvand igen

en extract
so defencelessly dissolved, gently ionized and
white, never the limit of invisibility so nearly
touched; June, June, your Jacob’s ladders,
your sleeping creatures and their dreams exist,
a drift of galactic seed between
earth so earthly and sky so heavenly,
the vale of tears so still, so still, and tears
sinking, sinking like groundwater back

da extract
i jorden; Jorden; Jorden i sit omløb
om Solen findes; Jorden på sin rute
gennem Mælkevejen findes; Jorden på vej
med sin last af jasminer, med jaspis og jern,
med jerntæpper, jærtegn og jubel, men Judaskys
kysset i flæng og jomfruelig vrede i
gaderne, Jesus af salt; med jacarandatræets
skygge over flodvandet, med jagtfalke, jagerfly
og januar i hjertet, med Jacopo della Quercias
brønd Fronte Gaia i Siena og med juli
så tung som en bombe; med hjemlige hjerner,
med hjertefejl og hjertegræs og jordbær,
med jerntræets rødder i den jordtrætte jord

en extract
into earth; Earth; Earth in its trajectory
around the sun exists, Earth on its journey
along the Milky Way, Earth on its course with
its cargo of jasmine, jasper, iron,
iron curtains, omens, jubilation, Judas’s kiss
kissed right and left, and virgin anger in
the streets, Jesus of salt; with the shadow of the
jacaranda over the river, with gyrfalcons, jet planes,
and January in the heart, with Jacopo della Quercia’s
well Fonte Gaia in Siena and with July
heavy as a bomb, with domestic brains
heart defects, quaking grass and strawberries
the ironwood’s roots in the earthworn earth

da extract
Jorden Jayadeva besynger i sit mystiske
digt fra det 12. århundrede; Jorden med
bevidsthedens kystlinie blå og med reder hvor
fiskehejren findes, med sin gråblå hvælvede
ryg, eller dværghejren findes, kryptisk
og sky, eller nathejren, silkehejren findes,
og graden af vingeslag hos jernspurve, traner
og duer; Jorden med Jullundur, Jabalpur og
Jungfrau findes, med Jotunheim og Jura

da extract
tegning lidt infrarød stråling
fra skoven der stadigvæk ryger

en extract
screen a bit of infrared radiation
from the forest that’s still smoking

da extract
er irrelevant og stråling fra
dyr i bevægelse aftegnes ikke

en extract
is irrelevant and radiation
from moving animals does not show up

da extract
en flok børn søger ly i en hule
kun iagttaget stumt af en hare

en extract
a group of children seeks shelter in a cave
mutely observed only by a hare

da extract
som om de var børn i barndommens
eventyr hører de vinden fortælle

en extract
as if they were children in childhood’s
fairy-tales they hear the wind tell

da extract
om de afbrændte marker
men børn er de ikke

en extract
of the burned-off fields
but they are no children

da extract
der er ingen der bærer dem mere

en extract
no one carries them any more

</script>
<div id="poem"></div>
</div>
<svg class="tri-lines" id="tri-lines" aria-hidden="true"></svg>
<script>
(function () {
  const poem = document.querySelector(".wrap");
  const svg = document.getElementById("tri-lines");
  const NS = "http://www.w3.org/2000/svg";

  const STOP = {
    da: new Set('a ad af alle alt altså at bag bare blandt da de dem den denne der deres det dette din dine disse dit du efter eller en end er et for fra før gennem har have helt hen her hos hun hvis hvor i ikke in ind is jeg kan kun lidt lige man med mellem men mere min mit mod ned nogen noget nogle nok nu når og også om omme op os over på selv sin sine sit skal som så til ud uden under var ved vi vil'.split(' ')),
    en: new Set('a about above across after against all along also always am among an and any anyone anything are around as at be because been before behind being below beneath between but by can could do does done down either even ever every everything except few for from had has have having he her here himself his how i if in inside into is it its itself just like many may me might mine more most must my myself neither never no nor not nothing of off on one only onto or other others our ourselves out outside over own same several she since so some somebody someone something still such than that the their them themselves then there these they this those through to too toward under until up upon us very was we were what when where whether which while who whose will with within without you your'.split(' ')),
  };

  function coreWord(word) {
    return word
      .replace(/[\u2018\u2019\u201A\u2032]/g, "'")
      .replace(/^[^\p{L}\p{N}_]+|[^\p{L}\p{N}_]+$/gu, "")
      .toLowerCase();
  }

  function firstLetter(word) {
    const m = word.match(/[A-Za-zÆØÅæøå]/);
    return m ? m[0].toLowerCase() : null;
  }

  function appendLine(parent, line, lang) {
    if (line === "~") {
      parent.append("\u00a0");
      return;
    }
    for (const part of line.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) {
        parent.append(part);
        continue;
      }
      const letter = firstLetter(part);
      if (!letter || STOP[lang].has(coreWord(part))) {
        parent.append(part);
        continue;
      }
      const span = document.createElement("span");
      span.className = "w";
      span.dataset.letter = letter;
      span.textContent = part;
      parent.append(span);
    }
  }

  function renderPoem() {
    const src = document.getElementById("poem-source").textContent.replace(/\r\n/g, "\n");
    const mount = document.getElementById("poem");
    const sections = [];
    let section = null;
    let para = null;
    function flushPara() {
      if (para && section && para.lines.length) section[para.lang].push(para);
      para = null;
    }
    for (const raw of src.split("\n")) {
      const line = raw.replace(/\s+$/g, "");
      const sec = line.match(/^#\s+(\d+)\s*$/);
      if (sec) {
        flushPara();
        section = { n: sec[1], da: [], en: [] };
        sections.push(section);
        continue;
      }
      if (line.startsWith("#")) continue;
      const head = line.match(/^(da|en)\s+(nonindent|nonindent01|nonindent02|nonindent03|extract)\s*$/);
      if (head) {
        flushPara();
        para = { lang: head[1], cls: head[2], lines: [] };
        continue;
      }
      if (!line) {
        flushPara();
        continue;
      }
      if (para) para.lines.push(line);
    }
    flushPara();
    for (const section of sections) {
      const secEl = document.createElement("section");
      secEl.className = "section";
      secEl.dataset.chapter = section.n;
      const h = document.createElement("h2");
      h.className = "section-num";
      h.textContent = section.n;
      secEl.append(h);
      const cols = document.createElement("div");
      cols.className = "cols";
      for (const lang of ["da", "en"]) {
        const col = document.createElement("div");
        col.className = "col col-" + lang;
        col.lang = lang;
        for (const info of section[lang]) {
          const p = document.createElement("p");
          p.className = info.cls;
          info.lines.forEach((line, i) => {
            if (i) p.append(document.createElement("br"));
            appendLine(p, line, lang);
          });
          col.append(p);
        }
        cols.append(col);
      }
      secEl.append(cols);
      mount.append(secEl);
    }
  }


  renderPoem();

  function normalize(text) {
    return text
      .toLowerCase()
      .replace(/[\u2018\u2019\u201A\u2032]/g, "'")
      .replace(/^[^\p{L}\p{N}']+|[^\p{L}\p{N}']+$/gu, "")
      .replace(/'+/g, "'");
  }

  function wrapBareWords(root) {
    root.querySelectorAll(".section .w").forEach((el) => el.classList.add("tok"));
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const parent = node.parentElement;
      if (!parent || parent.closest("header, script, style") || parent.classList.contains("tok")) continue;
      const raw = node.textContent;
      if (!raw || !raw.trim()) continue;
      const frag = document.createDocumentFragment();
      for (const part of raw.split(/(\s+)/)) {
        if (!part) continue;
        if (/^\s+$/.test(part)) {
          frag.append(part);
          continue;
        }
        const span = document.createElement("span");
        span.className = "tok";
        span.textContent = part;
        frag.append(span);
      }
      node.parentNode.replaceChild(frag, node);
    }
  }

  wrapBareWords(poem);

  function ngramsFor(words) {
    function ngramAt(i, n) {
      let s = words[i].key;
      for (let k = 1; k < n; k++) s += " " + words[i + k].key;
      return s;
    }
    function countNgram(seq, n) {
      let c = 0;
      for (let i = 0; i <= words.length - n; i++) {
        if (ngramAt(i, n) === seq) c++;
      }
      return c;
    }
    function expandRun(positions, len) {
      let pos = positions.slice();
      while (true) {
        if (pos.some((p) => p + len >= words.length)) break;
        const next = words[pos[0] + len].key;
        if (pos.some((p) => words[p + len].key !== next)) break;
        const newLen = len + 1;
        if (countNgram(ngramAt(pos[0], newLen), newLen) !== pos.length) break;
        len = newLen;
      }
      while (true) {
        if (pos.some((p) => p < 1)) break;
        const prev = words[pos[0] - 1].key;
        if (pos.some((p) => words[p - 1].key !== prev)) break;
        const newLen = len + 1;
        const shifted = pos.map((p) => p - 1);
        if (countNgram(ngramAt(shifted[0], newLen), newLen) !== pos.length) break;
        len = newLen;
        pos = shifted;
      }
      return { pos, len, key: ngramAt(pos[0], len) };
    }
    const triStarts = new Map();
    for (let i = 0; i <= words.length - 3; i++) {
      const key = ngramAt(i, 3);
      if (!triStarts.has(key)) triStarts.set(key, []);
      triStarts.get(key).push(i);
    }
    const local = new Map();
    for (const [, starts] of triStarts) {
      if (starts.length < 2) continue;
      const { pos, len, key } = expandRun(starts, 3);
      const allUncolored = Array.from({ length: len }, (_, k) => words[pos[0] + k].el)
        .every((el) => !el.classList.contains("w"));
      if (allUncolored) continue;
      if (!local.has(key)) {
        local.set(key, pos.map((p) => {
          const inst = [];
          for (let k = 0; k < len; k++) inst.push(words[p + k].el);
          return inst;
        }));
      }
    }
    return local;
  }

  const groups = new Map();
  for (const sel of [".col-da", ".col-en"]) {
    const toks = [...poem.querySelectorAll(sel + " .tok")].filter((el) => normalize(el.textContent));
    const words = toks.map((el) => ({ el, key: normalize(el.textContent) }));
    for (const [key, insts] of ngramsFor(words)) {
      const prefixed = sel + "::" + key;
      if (!groups.has(prefixed)) groups.set(prefixed, insts);
    }
  }

  function wrapGaps(left, right) {
    if (!left || !right || left.parentNode !== right.parentNode) return [];
    const gaps = [];
    let node = left.nextSibling;
    while (node && node !== right) {
      const next = node.nextSibling;
      if (node.nodeName === "BR") break;
      if (node.nodeType === Node.TEXT_NODE && /[ \t]/.test(node.textContent) && !/\n/.test(node.textContent)) {
        const span = document.createElement("span");
        span.className = "tri tri-gap";
        span.textContent = node.textContent;
        node.parentNode.replaceChild(span, node);
        gaps.push(span);
      } else if (node.nodeType === Node.ELEMENT_NODE && node.classList.contains("tri-gap")) {
        gaps.push(node);
      }
      node = next;
    }
    return gaps;
  }

  const startKey = new Map();
  const tokenKeys = new Map();
  function mark(el, key, pos) {
    el.classList.add("tri");
    if (!tokenKeys.has(el)) tokenKeys.set(el, []);
    if (!tokenKeys.get(el).includes(key)) tokenKeys.get(el).push(key);
    if (pos === 0) {
      const prev = startKey.get(el);
      if (!prev || key.split(" ").length > prev.split(" ").length) startKey.set(el, key);
    }
  }
  for (const [key, insts] of groups) {
    for (const inst of insts) {
      const wordEls = inst.slice();
      const gaps = [];
      for (let i = 0; i < wordEls.length - 1; i++) {
        gaps.push(...wrapGaps(wordEls[i], wordEls[i + 1]));
      }
      inst.push(...gaps);
      inst.forEach((el, pos) => mark(el, key, pos));
    }
  }

  function pickKey(el) {
    const keys = tokenKeys.get(el) || [];
    if (!keys.length) return null;
    const rank = (k) => [k.split(" ").length, groups.get(k).length];
    const best = (list) => list.slice().sort((a, b) => {
      const [la, ca] = rank(a);
      const [lb, cb] = rank(b);
      return lb - la || cb - ca;
    })[0];
    if (startKey.has(el)) return startKey.get(el);
    return best(keys);
  }

  function hitColor(inst) {
    const first = inst[0];
    const letter = (first.getAttribute("data-letter") || first.textContent.trim()[0] || "a").toLowerCase();
    const i = "abcdefghijklmnopqrstuvwxyz".indexOf(letter);
    const hue = i < 0 ? 0 : (i * 360) / 26;
    return `hsl(${hue.toFixed(1)}, 72%, 42%)`;
  }

  let active = null;
  let held = null;

  function clear() {
    if (held) return;
    active = null;
    document.body.classList.remove("tri-on");
    poem.querySelectorAll(".tri-hit").forEach((el) => {
      el.classList.remove("tri-hit");
      el.style.removeProperty("--hit");
    });
    svg.replaceChildren();
  }

  function release() {
    held = null;
    document.body.classList.remove("tri-held");
    active = null;
    document.body.classList.remove("tri-on");
    poem.querySelectorAll(".tri-hit").forEach((el) => {
      el.classList.remove("tri-hit");
      el.style.removeProperty("--hit");
    });
    svg.replaceChildren();
  }

  function show(key) {
    const insts = groups.get(key);
    if (!insts) return;
    active = key;
    document.body.classList.add("tri-on");
    const color = hitColor(insts[0]);
    document.body.style.setProperty("--hit", color);
    poem.querySelectorAll(".tri-hit").forEach((el) => el.classList.remove("tri-hit"));
    for (const inst of insts) {
      for (const el of inst) {
        el.classList.add("tri-hit");
        el.style.setProperty("--hit", color);
      }
    }
    draw(insts, color);
  }

  function draw(insts, color) {
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const height = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    svg.setAttribute("width", String(document.documentElement.clientWidth));
    svg.setAttribute("height", String(height));
    svg.style.height = height + "px";
    svg.replaceChildren();

    const boxes = insts.map((inst) => {
      const r = inst[0].getClientRects()[0] || inst[0].getBoundingClientRect();
      return { x: r.left, cy: r.top + r.height / 2 };
    });
    if (boxes.length < 2) return;

    const col = insts[0][0].closest(".col").getBoundingClientRect();
    const railX = Math.max(14, col.left + scrollX - 22);

    const pts = boxes.map((b) => ({
      x: b.x + scrollX,
      y: b.cy + scrollY,
    }));

    const g = document.createElementNS(NS, "g");
    g.setAttribute("fill", "none");
    g.setAttribute("stroke", color);
    g.setAttribute("stroke-width", "1.6");
    g.setAttribute("stroke-linecap", "round");
    g.setAttribute("stroke-linejoin", "round");
    g.setAttribute("opacity", "0.85");

    const spine = document.createElementNS(NS, "path");
    let d = `M ${railX} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) d += ` L ${railX} ${pts[i].y}`;
    spine.setAttribute("d", d);
    g.append(spine);

    for (const p of pts) {
      const arm = document.createElementNS(NS, "path");
      arm.setAttribute("d", `M ${p.x} ${p.y} L ${railX} ${p.y}`);
      g.append(arm);
      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("cx", String(p.x));
      dot.setAttribute("cy", String(p.y));
      dot.setAttribute("r", "3.2");
      dot.setAttribute("fill", color);
      dot.setAttribute("stroke", "none");
      g.append(dot);
    }
    svg.append(g);
  }

  let leaveTimer = null;

  function scheduleClear() {
    if (held) return;
    window.clearTimeout(leaveTimer);
    leaveTimer = window.setTimeout(() => {
      if (!held) clear();
    }, 50);
  }

  function cancelClear() {
    window.clearTimeout(leaveTimer);
  }

  poem.addEventListener("pointerover", (e) => {
    if (held) return;
    const tok = e.target.closest(".tok, .tri-gap");
    if (!tok || !tokenKeys.has(tok)) {
      scheduleClear();
      return;
    }
    const key = pickKey(tok);
    if (!key) {
      scheduleClear();
      return;
    }
    cancelClear();
    if (active !== key) show(key);
  });

  poem.addEventListener("pointerleave", () => {
    if (held) return;
    scheduleClear();
  });

  poem.addEventListener("click", (e) => {
    const tok = e.target.closest(".tok, .tri-gap");
    const key = tok && tokenKeys.has(tok) ? pickKey(tok) : null;
    if (!key) {
      if (held) release();
      return;
    }
    if (held === key) {
      release();
      return;
    }
    held = key;
    document.body.classList.add("tri-held");
    show(key);
  });

  window.addEventListener("scroll", () => { if (active) draw(groups.get(active), hitColor(groups.get(active)[0])); }, { passive: true });
  window.addEventListener("resize", () => { if (active) draw(groups.get(active), hitColor(groups.get(active)[0])); });
})();
</script>
</body>
</html>
